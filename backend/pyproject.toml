[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openarchive-server"
version = "0.1.0"
description = "OpenArchive — PostgreSQL·OpenSQL에 설치하는 AI 문서관리 플랫폼 (API·임베딩 워커·MCP 서버·웹 UI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "mcp<2",
    # 문서 파싱 — 업로드 phase에서 services/parsing.py가 사용한다.
    "pypdf",
    # 로컬 OCR(ADR-052). 시스템 tesseract·한국어 모델이 별도로 필요하다.
    "pytesseract",  # Apache-2.0
    "pypdfium2",  # BSD-3/Apache-2.0 — PDF 래스터화, poppler 불필요
    # 이미지 디코드·EXIF 회전(services/parsing.py). MIT-CMU. pytesseract·python-pptx가 끌고
    # 오던 것을 직접 import하므로 명시한다 — 그쪽이 의존을 끊으면 파서 import가 깨진다.
    "pillow",
    "python-docx",
    # HWP 5.0(OLE 복합 문서) 읽기. BSD. pyhwp는 AGPL-3.0이라 쓰지 않는다 — 레코드 순회는
    # services/parsing.py가 직접 한다.
    "olefile",
    # XLSX·PPTX 읽기. 둘 다 MIT.
    "openpyxl",
    "python-pptx",
    "python-multipart",
    # Louvain 군집(services/clusters.py). 순수 Python·BSD. torch가 끌고 오던 것을 기본
    # 의존성으로 승격 — [local] 없이도 덩어리가 계산되어야 한다.
    "networkx",
    # `openarchive import`·`export`의 마크다운 frontmatter(openarchive/cli.py). MIT. [local]이 끌고
    # 오던 것이라 기본 설치에는 없었다.
    "pyyaml",
]

# 상용 임베딩 API 클라이언트는 넣지 않는다 — 대회 규정상 사용할 수 없다 (ADR-003).

[project.scripts]
# 설치 준비 CLI (ADR-039). Web UI·REST·MCP와 같은 자리의 인터페이스이며 코어를 재사용한다.
openarchive = "openarchive.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx", # fastapi.testclient.TestClient가 요구한다
    "ruff",
    # wheel 내용 테스트가 --no-build-isolation으로 빌드한다. 3.12+ venv에는 setuptools가 없어
    # 이게 빠지면 CI에서만 빌드 백엔드를 못 찾는다. build-system.requires와 같은 하한이다.
    "setuptools>=68",
]
# 실제 임베딩(BAAI/bge-m3)을 돌릴 때만 필요하다. 기본 dependencies에 두지 않는 이유는
# sentence-transformers가 torch를 끌고 와 설치 용량이 수 GB 늘어나는 데 반해,
# 테스트·CI는 전부 FakeProvider로 돌기 때문이다 (ADR-003).
local = ["sentence-transformers"]

# 빌드된 프론트(ADR-041)와 마이그레이션 SQL을 wheel에 담는다. 빠지면 설치본에서 화면이
# 뜨지 않거나 init·API startup이 스키마를 찾지 못한다.
[tool.setuptools.package-data]
openarchive = ["static/**/*", "migrations/*.sql", "demo_corpus/**/*.md"]

[tool.setuptools.packages.find]
# tests는 설치 대상이 아니다. 최상위는 openarchive 하나다 — MCP 서버도 그 안에 있다 (#95-e).
include = ["openarchive*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 기본 룰(E4·E7·E9·F)에 import 정렬만 더한다.
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
