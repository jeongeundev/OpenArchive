[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openarchive-backend"
version = "0.1.0"
description = "OpenArchive 백엔드 — 문서 API·임베딩 워커·MCP 서버가 공유하는 패키지"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "mcp<2",
    # 문서 파싱 — 업로드 phase에서 services/parsing.py가 사용한다.
    "pypdf",
    "python-docx",
    "python-multipart",
]

# 상용 임베딩 API 클라이언트는 넣지 않는다 — 대회 규정상 사용할 수 없다 (ADR-003).

[project.scripts]
# 설치 준비 CLI (ADR-039). Web UI·REST·MCP와 같은 자리의 인터페이스이며 코어를 재사용한다.
openarchive = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx", # fastapi.testclient.TestClient가 요구한다
    "ruff",
]
# 실제 임베딩(BAAI/bge-m3)을 돌릴 때만 필요하다. 기본 dependencies에 두지 않는 이유는
# sentence-transformers가 torch를 끌고 와 설치 용량이 수 GB 늘어나는 데 반해,
# 테스트·CI는 전부 FakeProvider로 돌기 때문이다 (ADR-003).
local = ["sentence-transformers"]

# 빌드된 프론트를 wheel에 담는다 (ADR-041). 이것이 없으면 설치본에서 화면이 뜨지 않는다.
[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.setuptools.packages.find]
# tests는 설치 대상이 아니다. app과 MCP 서버 패키지만 배포한다.
include = ["app*", "mcp_server*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 기본 룰(E4·E7·E9·F)에 import 정렬만 더한다.
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
