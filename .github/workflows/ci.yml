name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://openarchive:openarchive@localhost:5433/openarchive
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openarchive
          POSTGRES_PASSWORD: openarchive
          POSTGRES_DB: openarchive
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openarchive -d openarchive"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OCR engine
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor
          tesseract --list-langs | grep -x kor
      - name: Install backend dependencies
        run: cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Check
        run: bash scripts/check.sh
      # check.sh가 정적 export를 다시 빌드한다. 커밋된 동봉 산출물이 소스와 어긋나면 여기서 드러난다.
      - name: Bundled static is up to date
        run: |
          if [ -n "$(git status --porcelain -- backend/openarchive/static)" ]; then
            git status --porcelain -- backend/openarchive/static
            echo "backend/openarchive/static이 소스와 다르다 — bash scripts/check.sh 후 산출물을 커밋할 것"
            exit 1
          fi
