name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://openarchive:openarchive@localhost:5433/openarchive
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openarchive
          POSTGRES_PASSWORD: openarchive
          POSTGRES_DB: openarchive
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openarchive -d openarchive"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Check
        run: bash scripts/check.sh
