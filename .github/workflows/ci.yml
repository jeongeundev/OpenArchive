name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENARCHIVE_REQUIRE_CONVERTERS: "1"
      DATABASE_URL: postgresql://openarchive:openarchive@localhost:5433/openarchive
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openarchive
          POSTGRES_PASSWORD: openarchive
          POSTGRES_DB: openarchive
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openarchive -d openarchive"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OCR engine
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor
          tesseract --list-langs | grep -x kor
      - name: Install preview converters
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap fontconfig fonts-noto-cjk libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          curl -fL https://github.com/edwardkim/rhwp/releases/download/v0.8.7/rhwp-v0.8.7-linux-x86_64.tar.gz -o /tmp/rhwp.tar.gz
          echo "24de2bdaa0b69f86302a27e7fdfb570ad3c53b0ab3a4eac06446adc651dfb988  /tmp/rhwp.tar.gz" | sha256sum -c -
          mkdir /tmp/rhwp-release
          tar -xzf /tmp/rhwp.tar.gz -C /tmp/rhwp-release
          sudo install -m 755 /tmp/rhwp-release/rhwp/rhwp /usr/local/bin/rhwp
          bwrap --unshare-all --ro-bind / / true
          rhwp --version
          soffice --version
          fc-list :lang=ko family | head -1
      - name: Install backend dependencies
        run: cd backend && python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Check
        run: bash scripts/check.sh
      # check.sh가 정적 export를 다시 빌드한다. 커밋된 동봉 산출물이 소스와 어긋나면 여기서 드러난다.
      - name: Bundled static is up to date
        run: |
          if [ -n "$(git status --porcelain -- backend/openarchive/static)" ]; then
            git status --porcelain -- backend/openarchive/static
            echo "backend/openarchive/static이 소스와 다르다 — bash scripts/check.sh 후 산출물을 커밋할 것"
            exit 1
          fi
